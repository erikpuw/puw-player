[package]
name = "puw-player"
version = "1.0.6"
edition = "2024"
rust-version = "1.92"
description = "Trình nghe nhạc offline cho Windows"

[features]
default = ["gui"]
gui = ["dep:slint", "dep:rfd", "dep:raw-window-handle", "dep:windows-sys", "dep:windows", "dep:souvlaki"]

[[bin]]
name = "puw-player"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rusqlite = { version = "0.41", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
lofty = "0.25.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Keep renderer-software: femtovg (OpenGL) measured 137 MB, skia 308 MB, this ~55 MB. Do not switch renderer.
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility", "unstable-winit-030", "raw-window-handle-06"] }
rfd = { version = "0.17", optional = true }
raw-window-handle = { version = "0.6", optional = true }
souvlaki = { version = "0.9.3", optional = true }

[target.'cfg(windows)'.dependencies]
# Same crate version as souvlaki: SMTC shuffle/repeat live on the object souvlaki does not expose.
windows = { version = "0.62", optional = true, features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry"] }

[build-dependencies]
slint-build = { version = "=1.18.1" }

[dev-dependencies]
tempfile = "3"
hound = "3.5"

[profile.release]
lto = "thin"
strip = true


# Optimize dependencies (Slint renderer, image decoding) even in debug builds so
# `cargo run` animates smoothly; the app crate itself stays fast to rebuild.
[profile.dev.package."*"]
opt-level = 2
